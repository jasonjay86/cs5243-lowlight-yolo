name: cs5243-lowlight-yolo
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - pip
  # Everything below is installed with pip so there is ONE source of truth for
  # versions. Do not also install `opencv` from conda: ultralytics depends on
  # `opencv-python`, and having both puts two cv2 builds in the same env.
  - pip:
      # Core (versions verified together on Python 3.10; see PR description)
      # numpy/opencv: ultralytics 8.4.173 refuses numpy 2.0-2.3.4 on macOS, and
      # numpy >= 2.3.5 needs Python >= 3.11, so on Python 3.10 we must use numpy 1.x.
      # opencv-python 4.11.0.86 is the newest 4.x that works with numpy 1.26.
      - numpy==1.26.4
      - opencv-python==4.11.0.86
      - pillow==12.3.0
      - pyyaml==6.0.3
      - tqdm==4.70.1
      - matplotlib==3.10.9
      - pandas==2.3.3
      # Deep learning. NOTE: the default PyPI wheel for torch 2.14.1 is a CUDA
      # 13.0 build (runs on CPU too, but a GPU needs an NVIDIA driver new enough
      # for CUDA 13). On a machine without a GPU you can instead install the CPU
      # wheel after creating the env (index not verified from the PR sandbox):
      #   pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
      - torch==2.14.1
      - torchvision==0.29.1
      - ultralytics==8.4.173 # YOLOv8 (detection/yolo_detector.py)
      - gdown==6.4.1 # SNR-Aware weights download (see enhancements/snr_aware/README.md)
